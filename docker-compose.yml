version: '3.8'

services:
  danshyar-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: danshyar_unified_server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
